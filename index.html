<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Guild Join</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:15px system-ui;padding:24px}
main{max-width:760px;margin:30px auto}.panel{background:#141c31;border:1px solid #293653;border-radius:18px;padding:22px}
h1{margin:0 0 6px;font-size:28px}.muted{color:#9eabc5}.field{margin:18px 0}label{display:block;margin-bottom:7px;color:#cbd5e8}
input,button{font:inherit;border-radius:10px;padding:12px;width:100%}input{background:#0c1427;border:1px solid #344362;color:white}
button{border:0;background:#6d7cff;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px}.actions button:last-child{background:#35415d}.stats{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.stat{background:#0c1427;padding:12px 16px;border-radius:10px;min-width:100px}.stat b{display:block;font-size:21px}
progress{width:100%;height:12px}pre{white-space:pre-wrap;background:#0c1427;padding:14px;border-radius:10px;max-height:260px;overflow:auto;color:#cbd5e8}
small{color:#aab6ce}.good{color:#73e0a1}.bad{color:#ff8585}
</style></head>
<body><main>
<div class="panel">
<h1>Auto Guild Join</h1><div class="muted">Upload accounts and start your guild join task.</div>
<div class="field"><label>Accounts JSON (must contain uid and password)</label><input id="file" type="file" accept=".json,application/json"><small id="fileInfo">No file selected</small></div>
<div class="field"><label>Manual Guild ID (optional; overrides each account's clan_id)</label><input id="guild" placeholder="Enter Guild ID"></div>

<div class="actions"><button id="start">Start Auto Join</button><button id="stop" disabled>Stop</button></div>
<div class="stats"><div class="stat"><b id="total">0</b><small>Total</small></div><div class="stat"><b id="done">0</b><small>Processed</small></div><div class="stat"><b id="success" class="good">0</b><small>Success</small></div><div class="stat"><b id="failed" class="bad">0</b><small>Failed</small></div></div>
<progress id="progress" value="0" max="100"></progress>
<h3>Live Logs</h3><pre id="logs">Waiting for accounts.json…</pre>
<p><small>Credentials are sent only to your Vercel server endpoint. Do not upload accounts you do not own or have permission to use.</small></p>
</div></main>
<script>
const $=id=>document.getElementById(id);let rows=[],stopRequested=false,running=false;
function log(s){$('logs').textContent+=`\\n${s}`;$('logs').scrollTop=$('logs').scrollHeight}
$('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('Top-level JSON must be an array');
 rows=data.map((a,i)=>{if(!a||a.uid===undefined||!a.password)throw Error(`Account ${i+1}: uid and password are required`);return a});
 $('fileInfo').textContent=`${rows.length} account(s) loaded`;log(`Loaded ${rows.length} accounts.`);
 }catch(err){rows=[];$('fileInfo').textContent='Invalid JSON: '+err.message;log('ERROR: '+err.message)}
});
$('stop').onclick=()=>{stopRequested=true;$('stop').disabled=true;log('Stop requested…')};
$('start').onclick=async()=>{
 if(running)return;if(!rows.length){alert('Upload a valid accounts JSON file first.');return}
 running=true;stopRequested=false;$('start').disabled=true;$('stop').disabled=false;
 let ok=0,fail=0,done=0;$('total').textContent=rows.length;$('done').textContent=0;$('success').textContent=0;$('failed').textContent=0;
 for(let i=0;i<rows.length;i++){
  if(stopRequested)break;
  const a=rows[i],guild=String($('guild').value.trim()||a.clan_id||'').trim();
  if(!guild){fail++;done++;log(`Account ${a.uid}: FAILED — no Guild ID (enter one or provide clan_id).`)}
  else try{
   const res=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    uid:String(a.uid),password:String(a.password),guild_id:guild
   })});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.ok)throw Error(data.error||`HTTP ${res.status}`);
   ok++;done++;log(`Account ${a.uid}: SUCCESS ${data.message||''}`);
  }catch(err){fail++;done++;log(`Account ${a.uid}: FAILED — ${err.message}`)}
  $('done').textContent=done;$('success').textContent=ok;$('failed').textContent=fail;$('progress').value=done/rows.length*100;
 }
 log(stopRequested?'Stopped by user.':`Finished. Success ${ok}, failed ${fail}.`);
 running=false;$('start').disabled=false;$('stop').disabled=true;
};
</script></body></html>
